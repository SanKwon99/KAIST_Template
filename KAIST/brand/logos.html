<!-- @dsCard group="Brand" viewport="700x200" name="Logos" subtitle="KAIST and KAIST DAIM Labs marks on paper and on the KAIST Blue section ground" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAIST — Logos</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px 28px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}
.row{display:flex;gap:10px}
.sw{flex:1;min-width:0}
.chip{height:56px;border:1px solid var(--color-divider)}
.nm{font-family:var(--font-heading);font-weight:600;font-size:15px;margin-top:6px}
.hx{font-size:11px;color:var(--text-muted);font-feature-settings:"tnum" 1}
.ramp{display:flex;gap:4px}.ramp>div{flex:1;height:28px}
.rl{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px}
.pane{flex:1;display:flex;align-items:center;justify-content:space-around;height:150px;border:1px solid var(--color-divider)}.blue{background:var(--color-accent);border-color:var(--color-accent)}img{display:block}
</style>
</head>
<body>
<div class="row">
<div class="pane"><img src="../assets/kaist-mark.png" alt="KAIST" style="height:40px"><img src="../assets/daim-mark.png" alt="KAIST DAIM Labs" style="height:52px"></div>
<div class="pane blue"><img src="../assets/kaist-mark-white.png" alt="KAIST" style="height:40px"><img src="../assets/daim-mark-white.png" alt="KAIST DAIM Labs" style="height:52px"></div>
</div>
</body>
</html>
