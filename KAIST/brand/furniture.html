<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAIST — Slide furniture</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px 28px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}
.row{display:flex;gap:10px}
.sw{flex:1;min-width:0}
.chip{height:56px;border:1px solid var(--color-divider)}
.nm{font-family:var(--font-heading);font-weight:600;font-size:15px;margin-top:6px}
.hx{font-size:11px;color:var(--text-muted);font-feature-settings:"tnum" 1}
.ramp{display:flex;gap:4px}.ramp>div{flex:1;height:28px}
.rl{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px}
.fr{position:relative;height:100px;border-top:2px solid var(--color-accent);border-bottom:1px solid color-mix(in srgb,var(--color-accent) 45%,transparent);margin-top:22px}
.ft{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:8px}.ft b{color:var(--color-accent);font-weight:400}
.dm{position:absolute;right:0;top:-24px;height:20px}.k{font-family:var(--font-heading);font-weight:600;color:var(--color-accent);font-size:11px;letter-spacing:.08em;position:absolute;left:0;top:-18px}
</style>
</head>
<body>
<div class="fr"><span class="k">01 · SECTION</span><img class="dm" src="../assets/daim-mark.png" alt="KAIST DAIM Labs"></div>
<div class="ft"><img src="../assets/kaist-mark.png" alt="KAIST" style="height:14px"><span>© 2026 DAIM Labs. All rights reserved</span><b>5</b></div>
</body>
</html>
