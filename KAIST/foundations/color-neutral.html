<!-- @dsCard group="Colors" viewport="700x150" name="Ground & ink" subtitle="Technical light ground, navy ink, cool surface, blue-tinted hairlines" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAIST — Ground & ink</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px 28px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}
.row{display:flex;gap:10px}
.sw{flex:1;min-width:0}
.chip{height:56px;border:1px solid var(--color-divider)}
.nm{font-family:var(--font-heading);font-weight:600;font-size:15px;margin-top:6px}
.hx{font-size:11px;color:var(--text-muted);font-feature-settings:"tnum" 1}
.ramp{display:flex;gap:4px}.ramp>div{flex:1;height:28px}
.rl{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px}

</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--color-bg)"></div><div class="nm">Ground</div><div class="hx">--color-bg · #F2F2F3</div></div>
<div class="sw"><div class="chip" style="background:var(--color-surface)"></div><div class="nm">Surface</div><div class="hx">--color-surface · #E4EAF3</div></div>
<div class="sw"><div class="chip" style="background:var(--color-text)"></div><div class="nm">Ink</div><div class="hx">--color-text · #101E33 · 15:1</div></div>
<div class="sw"><div class="chip" style="background:var(--color-divider)"></div><div class="nm">Divider</div><div class="hx">KAIST Blue at 20%</div></div>
</div>
</body>
</html>
