<!-- @dsCard group="Colors" viewport="700x220" name="Tonal ramps" subtitle="100–900 on one OKLCH lightness scale; KAIST Blue = accent 800, Light Blue = accent-2 600" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAIST — Tonal ramps</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px 28px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}
.row{display:flex;gap:10px}
.sw{flex:1;min-width:0}
.chip{height:56px;border:1px solid var(--color-divider)}
.nm{font-family:var(--font-heading);font-weight:600;font-size:15px;margin-top:6px}
.hx{font-size:11px;color:var(--text-muted);font-feature-settings:"tnum" 1}
.ramp{display:flex;gap:4px}.ramp>div{flex:1;height:28px}
.rl{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px}

</style>
</head>
<body>
<p class="lbl">Accent · KAIST Blue</p><div class="ramp"><div style="background:var(--color-accent-100)"></div><div style="background:var(--color-accent-200)"></div><div style="background:var(--color-accent-300)"></div><div style="background:var(--color-accent-400)"></div><div style="background:var(--color-accent-500)"></div><div style="background:var(--color-accent-600)"></div><div style="background:var(--color-accent-700)"></div><div style="background:var(--color-accent-800)"></div><div style="background:var(--color-accent-900)"></div></div><div class="rl"><span>100</span><span>500</span><span>900</span></div>
<p class="lbl" style="margin-top:14px">Accent 2 · Light Blue</p><div class="ramp"><div style="background:var(--color-accent-2-100)"></div><div style="background:var(--color-accent-2-200)"></div><div style="background:var(--color-accent-2-300)"></div><div style="background:var(--color-accent-2-400)"></div><div style="background:var(--color-accent-2-500)"></div><div style="background:var(--color-accent-2-600)"></div><div style="background:var(--color-accent-2-700)"></div><div style="background:var(--color-accent-2-800)"></div><div style="background:var(--color-accent-2-900)"></div></div><div class="rl"><span>100</span><span>500</span><span>900</span></div>
<p class="lbl" style="margin-top:14px">Neutral · cool</p><div class="ramp"><div style="background:var(--color-neutral-100)"></div><div style="background:var(--color-neutral-200)"></div><div style="background:var(--color-neutral-300)"></div><div style="background:var(--color-neutral-400)"></div><div style="background:var(--color-neutral-500)"></div><div style="background:var(--color-neutral-600)"></div><div style="background:var(--color-neutral-700)"></div><div style="background:var(--color-neutral-800)"></div><div style="background:var(--color-neutral-900)"></div></div><div class="rl"><span>100</span><span>500</span><span>900</span></div>
</body>
</html>
