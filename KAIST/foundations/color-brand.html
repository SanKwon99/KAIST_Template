<!-- @dsCard group="Colors" viewport="700x150" name="Brand blues" subtitle="KAIST Blue carries frames, titles and dividers; Light Blue is the second voice" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAIST — Brand blues</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px 28px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}
.row{display:flex;gap:10px}
.sw{flex:1;min-width:0}
.chip{height:56px;border:1px solid var(--color-divider)}
.nm{font-family:var(--font-heading);font-weight:600;font-size:15px;margin-top:6px}
.hx{font-size:11px;color:var(--text-muted);font-feature-settings:"tnum" 1}
.ramp{display:flex;gap:4px}.ramp>div{flex:1;height:28px}
.rl{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px}

</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--color-accent)"></div><div class="nm">KAIST Blue</div><div class="hx">--color-accent · #004191 · 8.7:1</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent-2)"></div><div class="nm">KAIST Light Blue</div><div class="hx">--color-accent-2 · #1487C8 · 3.5:1</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent-700)"></div><div class="nm">Accent 700</div><div class="hx">body copy in blue · #215BAE</div></div>
</div>
</body>
</html>
